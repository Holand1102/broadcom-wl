name: Build wl.ko for kernel 4.9.226

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y build-essential bc kmod cpio flex bison libelf-dev linux-headers-4.9.0-14-amd64

    - name: Clone source
      run: |
        git clone https://github.com/${{ github.repository }} broadcom-wl
        cd broadcom-wl
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: wl.ko
        path: broadcom-wl/wl.ko
